<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用帮助 · WithYou 情感教练系统</title>
<meta name="description" content="WithYou 情感教练系统使用说明书 — 让 0 基础用户看完就能上手、复制粘贴就能拿到答案。">
<link rel="icon" href="assets/fox-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>/* ========================================================
   HELP · Neumorphism (新拟物派) · 品牌配色
   暖阳橙 #E67E22 + 深青墨 #1A535C · 底色 #e0e5ec
   ======================================================== */
:root {
  --bg:#e0e5ec; --bg-soft:#f0f0f3;
  --sh-sm:4px 4px 8px #b8bcc2,-4px -4px 8px #ffffff;
  --sh-md:6px 6px 12px #b8bcc2,-6px -6px 12px #ffffff;
  --sh-inset-sm:inset 4px 4px 8px #b8bcc2,inset -4px -4px 8px #ffffff;
  --sh-inset-md:inset 6px 6px 12px #b8bcc2,inset -6px -6px 12px #ffffff;
  --ink:#1A535C; --ink-soft:#46656c; --ink-mute:#64828a;
  --accent:#E67E22; --accent-soft:rgba(230,126,34,.12);
  --font-display:'Nunito','PingFang SC',-apple-system,system-ui,sans-serif;
  --font-body:'Nunito','PingFang SC',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --container:1280px; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);font-size:16px;line-height:1.7;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
::selection{background:rgba(230,126,34,.25);}
img{max-width:100%;display:block;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
.container{max-width:var(--container);margin:0 auto;padding:0 32px;}

/* NAV */
.navbar{position:sticky;top:0;z-index:100;background:var(--bg);}
.nav-inner{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap;}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;font-family:var(--font-display);color:var(--ink);}
.nav-brand img{mix-blend-mode:multiply;}
.nav-links{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto;}
.nav-links a{font-size:.85rem;color:var(--ink-soft);transition:color .3s ease-in-out;}
.nav-links a:hover,.nav-links a.active{color:var(--accent);text-decoration:none;}
.nav-links a.active{font-weight:700;}

/* MOBILE NAV */
.mobile-nav{display:none;width:36px;height:36px;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:4px;border-radius:10px;background:none;border:none;}
.mobile-nav:hover{background:rgba(184,188,194,.25);}
.mobile-nav span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;transition:all .3s ease-in-out;}
.mobile-nav.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px);}
.mobile-nav.open span:nth-child(2){opacity:0;}
.mobile-nav.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px);}
.mobile-menu-wrap{display:none;width:100%;background:var(--bg);}
.mobile-menu-wrap.show{display:block;}
#mobileMenu a{display:block;padding:10px 20px;font-size:.88rem;color:var(--ink-soft);border-bottom:1px solid rgba(184,188,194,.35);}
#mobileMenu a:last-child{border-bottom:none;}
@media(min-width:701px){
  .mobile-nav{display:none !important;}
  #mobileMenu{display:none !important;}
}
@media(max-width:700px){
  .nav-links{display:none !important;}
  .nav-inner{flex-wrap:nowrap;}
  .nav-brand{margin-right:auto;}
}

/* LAYOUT */
.help-layout{display:grid;grid-template-columns:240px 1fr;gap:48px;max-width:1280px;margin:0 auto;padding:48px 32px;align-items:start;}
@media(max-width:900px){.help-layout{grid-template-columns:1fr;padding:24px 20px;gap:24px;}}

/* SIDEBAR */
.help-sidebar{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px;}
@media(max-width:900px){.help-sidebar{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;}}
.sidebar-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:8px;padding-bottom:8px;box-shadow:0 1px 0 rgba(184,188,194,.45);}
@media(max-width:900px){.sidebar-label{width:100%;}}
.sidebar-link{display:block;padding:6px 12px;border-radius:10px;font-size:.84rem;color:var(--ink-soft);transition:box-shadow .3s ease-in-out,color .3s ease-in-out;cursor:pointer;}
.sidebar-link:hover{color:var(--ink);text-decoration:none;box-shadow:var(--sh-sm);}
.sidebar-link.active{color:var(--accent);font-weight:700;box-shadow:var(--sh-inset-sm);}

/* CONTENT */
.help-content{max-width:820px;}
.help-content .doc-header{margin-bottom:48px;}
.help-content h1{font-family:var(--font-display);font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.2;margin-bottom:16px;}
.help-content .doc-meta{font-size:.8rem;color:var(--ink-mute);margin-bottom:40px;padding-bottom:20px;box-shadow:0 1px 0 rgba(184,188,194,.45);}

/* MARKDOWN RENDERED STYLES */
.help-content h2{font-family:var(--font-display);font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:48px 0 20px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:10px;}
.help-content h3{font-family:var(--font-display);font-size:1.1rem;font-weight:800;color:var(--ink);margin:28px 0 12px;}
.help-content h4{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--ink-soft);margin:20px 0 10px;}
.help-content p{margin-bottom:14px;color:var(--ink-soft);font-size:.95rem;}
.help-content ul,.help-content ol{margin:0 0 16px 20px;color:var(--ink-soft);font-size:.95rem;}
.help-content li{margin-bottom:6px;}
.help-content blockquote{margin:16px 0;padding:16px 20px;background:var(--bg);box-shadow:var(--sh-inset-sm);border-radius:12px;color:var(--ink-soft);}
.help-content table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.9rem;}
.help-content th{text-align:left;padding:10px 14px;background:var(--bg-soft);color:var(--ink);font-weight:700;border-bottom:2px solid rgba(184,188,194,.5);font-size:.82rem;}
.help-content td{padding:10px 14px;border-bottom:1px solid rgba(184,188,194,.35);color:var(--ink-soft);}
.help-content tr:hover td{background:rgba(184,188,194,.15);}
.help-content code{font-family:var(--font-mono);font-size:.84rem;background:rgba(184,188,194,.25);padding:2px 6px;border-radius:6px;color:var(--ink);}
.help-content pre{background:var(--bg);box-shadow:var(--sh-inset-md);border-radius:12px;padding:16px 18px;margin-bottom:20px;overflow-x:auto;position:relative;}
.help-content pre code{background:none;padding:0;font-size:.84rem;white-space:pre-wrap;line-height:1.7;color:var(--ink-soft);}
.help-content hr{margin:40px 0;border:none;box-shadow:0 1px 0 rgba(184,188,194,.45);}
.help-content strong{font-weight:800;color:var(--ink);}

/* COPY BTN */
.copy-btn{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--bg);border-radius:8px;padding:3px 10px;box-shadow:var(--sh-sm);transition:box-shadow .3s ease-in-out;}
.copy-btn:hover{box-shadow:2px 2px 4px #b8bcc2,-2px -2px 4px #ffffff;}
.copy-btn.copied{background:var(--accent);color:#fff;box-shadow:none;}

/* NOTE BLOCKS — 凹陷信息井 */
.note-block{margin:16px 0;padding:16px 20px;background:var(--bg);box-shadow:var(--sh-inset-sm);border-radius:12px;color:var(--ink-soft);}
.note-block.warn{background:rgba(230,126,34,.10);}
.note-block.danger{background:rgba(255,69,58,.10);}
.note-block p:last-child{margin-bottom:0;}

/* LOADING */
.loading{text-align:center;padding:80px 0;color:var(--ink-mute);font-size:.95rem;}

/* BACK TO TOP */
.back-to-top{position:fixed;bottom:32px;right:32px;width:44px;height:44px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:var(--sh-md);opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;}
.back-to-top.show{opacity:1;pointer-events:auto;cursor:pointer;}

/* FOOTER */
.footer{background:var(--bg-soft);padding:40px 0;margin-top:80px;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-meta{font-size:.78rem;color:var(--ink-mute);}
.footer-meta a{color:var(--ink-soft);margin-right:16px;transition:color .3s ease-in-out;}
.footer-meta a:hover{color:var(--accent);}
</style>
</head>
<body>

<!-- NAV -->
<nav class="navbar">
  <div class="container nav-inner">
    <a class="nav-brand" href="index.html">
      <img src="assets/fox-logo.png" alt="WithYou" style="width:32px;height:32px;border-radius:8px;object-fit:contain;">
      WithYou
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="index.html#how">怎么判断</a>
      <a href="index.html#why">为什么不同</a>
      <a href="index.html#demo">实测样例</a>
      <a href="index.html#story">为什么</a>
      <a href="index.html#start">开始使用</a>
      <a href="help.html" class="active">使用帮助</a>
    </div>
    <button class="mobile-nav" id="mobileNav" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu-wrap" id="mobileMenuWrap">
  <div id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="index.html#how">怎么判断</a>
    <a href="index.html#why">为什么不同</a>
    <a href="index.html#demo">实测样例</a>
    <a href="index.html#story">为什么</a>
    <a href="index.html#start">开始使用</a>
    <a href="help.html">使用帮助</a>
  </div>
  </div>
</nav>

<!-- LAYOUT -->
<div class="help-layout">

<!-- SIDEBAR -->
<aside class="help-sidebar" id="sidebar">
  <div class="sidebar-label">目录</div>
  <div id="toc-links"></div>
</aside>

<!-- CONTENT -->
<main class="help-content" id="helpContent">
  <div class="loading" id="loading">正在加载使用手册...</div>
</main>
</div>

<!-- BACK TO TOP -->
<div class="back-to-top" id="backToTop">↑</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-meta">© 2026 WithYou · 先看懂关系,再说下一句</div>
    <div class="footer-meta">
      <a href="index.html">首页</a>
      <a href="index.html#how">怎么判断</a>
      <a href="index.html#why">为什么不同</a>
      <a href="index.html#demo">实测样例</a>
      <a href="index.html#story">为什么</a>
      <a href="index.html#start">开始使用</a>
      <a href="help.html">使用帮助</a>
    </div>
  </div>
</footer>

<script>
/* Mobile nav */
var mobileNav = document.getElementById('mobileNav');
var mobileMenuWrap = document.getElementById('mobileMenuWrap');
if (mobileNav && mobileMenuWrap) {
  mobileNav.addEventListener('click', function() {
    mobileNav.classList.toggle('open');
    mobileMenuWrap.classList.toggle('show');
  });
}

/* Back to top */
var bt = document.getElementById('backToTop');
window.addEventListener('scroll', function() { bt.classList.toggle('show', window.scrollY > 600); }, { passive: true });
bt.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

/* TOC: build from h2 */
function buildTOC() {
  var h2s = document.querySelectorAll('.help-content h2');
  var toc = document.getElementById('toc-links');
  toc.innerHTML = '';
  h2s.forEach(function(h) {
    var raw = h.textContent.trim();
    /* skip non-section headings */
    if (raw.includes('📚 目录') || raw === '文档结束') return;
    /* extract display text: strip "第X部分：" prefix and any parenthetical suffix */
    var display = raw
      .replace(/^第[^：\n]+：/, '')       /* remove "第X部分：" */
      .replace(/\s*\([^)]*\)$/, '')        /* remove trailing "(xxx)" like "（⭐ 必读）" */
      .trim();
    var clean = display.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').trim();
    var id = h.id || clean;
    h.id = id;
    var a = document.createElement('a');
    a.className = 'sidebar-link';
    a.href = '#' + id;
    a.textContent = display;
    toc.appendChild(a);
  });
}

/* Scroll spy */
function onScroll() {
  var scroll = window.scrollY + 120;
  var cur = null;
  document.querySelectorAll('.help-content h2[id]').forEach(function(h) {
    if (h.offsetTop <= scroll) cur = h.id;
  });
  document.querySelectorAll('.sidebar-link').forEach(function(l) {
    l.classList.toggle('active', l.getAttribute('href') === '#' + cur);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

/* Copy buttons */
function addCopyButtons() {
  document.querySelectorAll('pre').forEach(function(pre) {
    if (pre.querySelector('.copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    pre.appendChild(btn);
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var text = pre.querySelector('code').textContent;
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1800);
      }).catch(function() {
        btn.textContent = '失败';
        setTimeout(function() { btn.textContent = '复制'; }, 1500);
      });
    });
  });
}

/* Load & render */
marked.use({
  breaks: true,
  gfm: true
});

fetch('help.md')
  .then(function(r) { return r.text(); })
  .then(function(text) {
    var html = marked.parse(text);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('helpContent').innerHTML = html;
    buildTOC();
    addCopyButtons();
    onScroll();
  })
  .catch(function() {
    document.getElementById('loading').textContent = '加载失败，请刷新重试。';
  });
</script>
</body>
