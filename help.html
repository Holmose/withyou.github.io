<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用帮助 · WithYou 情感教练系统</title>
<meta name="description" content="WithYou 情感教练系统使用说明书 — 让 0 基础用户看完就能上手、复制粘贴就能拿到答案。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --space:#ffffff;--space-2:#f5f5f7;--space-3:#e8e8ed;--ink:#1d1d1f;--ink-soft:#6e6e73;--ink-mute:#86868b;--hairline:rgba(0,0,0,.08);--hairline-2:rgba(0,0,0,.16);
  --blue:#0071e3;--blue-hover:#0077ed;
  --card:#ffffff;--shadow-sm:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);--shadow-md:0 8px 30px rgba(0,0,0,.10);
  --font-display:'Inter','PingFang SC',-apple-system,system-ui,sans-serif;--font-body:'Inter','PingFang SC',system-ui,sans-serif;--font-mono:'JetBrains Mono','SF Mono',monospace;
  --container:1280px;--radius:18px;
}
[data-theme="dark"] {
  --space:#000000;--space-2:#111111;--space-3:#1d1d1f;--ink:#f5f5f7;--ink-soft:#a1a1a6;--ink-mute:#6e6e73;--hairline:rgba(255,255,255,.14);--hairline-2:rgba(255,255,255,.24);
  --blue:#2997ff;--blue-hover:#0a84ff;
  --card:#111111;--shadow-sm:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.5);--shadow-md:0 8px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);font-size:16px;line-height:1.7;color:var(--ink);background:var(--space);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
::selection{background:rgba(0,113,227,.18);}
img{max-width:100%;display:block;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
.container{max-width:var(--container);margin:0 auto;padding:0 32px;}

/* NAV */
.navbar{position:sticky;top:0;z-index:100;background:var(--space);border-bottom:1px solid var(--hairline);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.nav-inner{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap;}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:var(--ink);}
.nav-brand-dot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--blue);color:#fff;border-radius:6px;font-size:.85rem;font-weight:700;}
.nav-links{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto;}
.nav-links a{font-size:.85rem;color:var(--ink-soft);transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);text-decoration:none;}
.nav-links a.active{font-weight:600;}
.theme-toggle{margin-left:auto;font-size:1.1rem;padding:4px 8px;border-radius:8px;transition:background .2s;}
.theme-toggle:hover{background:var(--space-2);}

/* LAYOUT */
.help-layout{display:grid;grid-template-columns:240px 1fr;gap:48px;max-width:1280px;margin:0 auto;padding:48px 32px;align-items:start;}
@media(max-width:900px){.help-layout{grid-template-columns:1fr;padding:24px 20px;gap:24px;}}

/* SIDEBAR */
.help-sidebar{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px;}
@media(max-width:900px){.help-sidebar{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;}}
.sidebar-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--hairline);}
@media(max-width:900px){.sidebar-label{width:100%;}}
.sidebar-link{display:block;padding:6px 10px;border-radius:8px;font-size:.84rem;color:var(--ink-soft);transition:all .15s;cursor:pointer;}
.sidebar-link:hover{background:var(--space-2);color:var(--ink);text-decoration:none;}
.sidebar-link.active{background:rgba(0,113,227,.1);color:var(--blue);font-weight:600;}

/* CONTENT */
.help-content{max-width:820px;}
.help-content .doc-header{margin-bottom:48px;}
.help-content h1{font-family:var(--font-display);font-size:clamp(1.8rem,3vw,2.4rem);font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1.2;margin-bottom:16px;}
.help-content .doc-meta{font-size:.8rem;color:var(--ink-mute);margin-bottom:40px;padding-bottom:20px;border-bottom:1px solid var(--hairline);}

/* MARKDOWN RENDERED STYLES */
.help-content h2{font-family:var(--font-display);font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:700;color:var(--ink);letter-spacing:-.02em;margin:48px 0 20px;padding-bottom:12px;border-bottom:2px solid var(--blue);display:flex;align-items:center;gap:10px;}
.help-content h3{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--ink);margin:28px 0 12px;}
.help-content h4{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--ink-soft);margin:20px 0 10px;}
.help-content p{margin-bottom:14px;color:var(--ink-soft);font-size:.95rem;}
.help-content ul,.help-content ol{margin:0 0 16px 20px;color:var(--ink-soft);font-size:.95rem;}
.help-content li{margin-bottom:6px;}
.help-content blockquote{margin:16px 0;padding:16px 20px;background:rgba(0,113,227,.06);border-left:3px solid var(--blue);border-radius:0 12px 12px 0;color:var(--ink-soft);}
.help-content table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:.9rem;}
.help-content th{text-align:left;padding:10px 14px;background:var(--space-2);color:var(--ink);font-weight:600;border-bottom:2px solid var(--hairline);font-size:.82rem;}
.help-content td{padding:10px 14px;border-bottom:1px solid var(--hairline);color:var(--ink-soft);}
.help-content tr:hover td{background:var(--space-2);}
.help-content code{font-family:var(--font-mono);font-size:.84rem;background:var(--space-2);padding:2px 6px;border-radius:4px;color:var(--ink);}
.help-content pre{background:var(--space-2);border:1px solid var(--hairline);border-radius:10px;padding:16px 18px;margin-bottom:20px;overflow-x:auto;position:relative;}
.help-content pre code{background:none;padding:0;font-size:.84rem;white-space:pre-wrap;line-height:1.7;}
.help-content hr{margin:40px 0;border:none;border-top:1px solid var(--hairline);}
.help-content strong{font-weight:700;color:var(--ink);}

/* COPY BTN */
.copy-btn{position:absolute;top:10px;right:10px;font-size:.72rem;color:var(--blue);background:var(--space);border:1px solid var(--hairline);border-radius:6px;padding:3px 10px;cursor:pointer;transition:all .15s;}
.copy-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.copy-btn.copied{background:#34c759;color:#fff;border-color:#34c759;}

/* NOTE BLOCKS */
.note-block{margin:16px 0;padding:16px 20px;background:rgba(0,113,227,.06);border-left:3px solid var(--blue);border-radius:0 12px 12px 0;}
.note-block.warn{background:rgba(255,149,0,.06);border-color:#ff9500;}
.note-block.danger{background:rgba(255,69,58,.06);border-color:#ff453a;}
.note-block p:last-child{margin-bottom:0;}

/* LOADING */
.loading{text-align:center;padding:80px 0;color:var(--ink-mute);font-size:.95rem;}

/* BACK TO TOP */
.back-to-top{position:fixed;bottom:32px;right:32px;width:42px;height:42px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:var(--shadow-md);opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;}
.back-to-top.show{opacity:1;pointer-events:auto;cursor:pointer;}

/* FOOTER */
.footer{border-top:1px solid var(--hairline);padding:40px 0;margin-top:80px;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-meta{font-size:.78rem;color:var(--ink-mute);}
.footer-meta a{color:var(--ink-soft);margin-right:16px;transition:color .2s;}
.footer-meta a:hover{color:var(--ink);}
</style>
</head>
<body>

<!-- NAV -->
<nav class="navbar">
  <div class="container nav-inner">
    <a class="nav-brand" href="index.html">
      <span class="nav-brand-dot">W</span>
      WithYou
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="index.html#how">怎么判断</a>
      <a href="index.html#why">为什么不同</a>
      <a href="index.html#demo">实测样例</a>
      <a href="index.html#story">为什么</a>
      <a href="index.html#start">开始使用</a>
      <a href="help.html" class="active">使用帮助</a>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="help-layout">

<!-- SIDEBAR -->
<aside class="help-sidebar" id="sidebar">
  <div class="sidebar-label">目录</div>
  <div id="toc-links"></div>
</aside>

<!-- CONTENT -->
<main class="help-content" id="helpContent">
  <div class="loading" id="loading">正在加载使用手册...</div>
</main>
</div>

<!-- BACK TO TOP -->
<div class="back-to-top" id="backToTop">↑</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-meta">© 2026 WithYou · 先看懂关系,再说下一句</div>
    <div class="footer-meta">
      <a href="index.html">首页</a>
      <a href="index.html#how">怎么判断</a>
      <a href="index.html#why">为什么不同</a>
      <a href="index.html#demo">实测样例</a>
      <a href="index.html#story">为什么</a>
      <a href="index.html#start">开始使用</a>
      <a href="help.html">使用帮助</a>
    </div>
  </div>
</footer>

<script>
/* Theme */
var toggle = document.getElementById('themeToggle');
toggle.addEventListener('click', function() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
  toggle.textContent = dark ? '🌙' : '☀️';
});

/* Back to top */
var bt = document.getElementById('backToTop');
window.addEventListener('scroll', function() { bt.classList.toggle('show', window.scrollY > 600); }, { passive: true });
bt.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

/* TOC: build from h2 */
function buildTOC() {
  var h2s = document.querySelectorAll('.help-content h2');
  var toc = document.getElementById('toc-links');
  toc.innerHTML = '';
  h2s.forEach(function(h) {
    var raw = h.textContent.trim();
    /* skip non-section headings */
    if (raw.includes('📚 目录') || raw === '文档结束') return;
    /* extract display text: strip "第X部分：" prefix and any parenthetical suffix */
    var display = raw
      .replace(/^第[^：\n]+：/, '')       /* remove "第X部分：" */
      .replace(/\s*\([^)]*\)$/, '')        /* remove trailing "(xxx)" like "（⭐ 必读）" */
      .trim();
    var clean = display.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').trim();
    var id = h.id || clean;
    h.id = id;
    var a = document.createElement('a');
    a.className = 'sidebar-link';
    a.href = '#' + id;
    a.textContent = display;
    toc.appendChild(a);
  });
}

/* Scroll spy */
function onScroll() {
  var scroll = window.scrollY + 120;
  var cur = null;
  document.querySelectorAll('.help-content h2[id]').forEach(function(h) {
    if (h.offsetTop <= scroll) cur = h.id;
  });
  document.querySelectorAll('.sidebar-link').forEach(function(l) {
    l.classList.toggle('active', l.getAttribute('href') === '#' + cur);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

/* Copy buttons */
function addCopyButtons() {
  document.querySelectorAll('pre').forEach(function(pre) {
    if (pre.querySelector('.copy-btn')) return;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    pre.appendChild(btn);
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var text = pre.querySelector('code').textContent;
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1800);
      }).catch(function() {
        btn.textContent = '失败';
        setTimeout(function() { btn.textContent = '复制'; }, 1500);
      });
    });
  });
}

/* Load & render */
marked.use({
  breaks: true,
  gfm: true
});

fetch('help.md')
  .then(function(r) { return r.text(); })
  .then(function(text) {
    var html = marked.parse(text);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('helpContent').innerHTML = html;
    buildTOC();
    addCopyButtons();
    onScroll();
  })
  .catch(function() {
    document.getElementById('loading').textContent = '加载失败，请刷新重试。';
  });
</script>
</body>
</html>
